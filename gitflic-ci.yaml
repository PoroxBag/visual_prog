image: ubuntu:latest

variables:
  TEST_1_SUCCESS: "true"
  TEST_2_SUCCESS: "true"

before_script:
  - echo "Скрипт до основных инструкций"

stages:
  - test
  - build
  - deploy

jobs:
  build:
    stage: build
    scripts:
      - echo "Сборка проекта"
      - echo "Собранный проект" > build.txt
    artifacts:
      paths:
        - build.txt

  test1:
    stage: test
    scripts:
      - echo "Первый набор тестов"
      - echo $TEST_1_SUCCESS

  test2:
    stage: test
    scripts:
      - echo "Второй набор тестов"
      - echo $TEST_2_SUCCESS

  deploy:
    stage: deploy
    scripts:
      - echo $(cat build.txt)
      - echo "Развертывание проекта"
    needs:
      - build
    rules:
      - if: $TEST_1_SUCCESS == "true" && $TEST_2_SUCCESS == "true"

after_script:
  - echo "Скрипт после основных инструкций"
