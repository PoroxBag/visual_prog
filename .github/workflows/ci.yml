name: CI Pipeline

on:
  push:
    branches: [ master, lab3, lab4, lab5, lab6, lab7 ]
  pull_request:
    branches: [ master, lab3, lab4, lab5, lab6, lab7 ]

jobs:
  install-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:run