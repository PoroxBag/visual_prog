name: CI Pipeline

on:
  push:
    branches: [ master, lab3, lab4 ]
  pull_request:
    branches: [ master, lab3, lab4 ]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run